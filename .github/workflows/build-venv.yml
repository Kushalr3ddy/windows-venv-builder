name: Build Windows venv

on:
  push:
    paths:
      - requirements.txt
      - .python-version
      - .github/workflows/build-venv.yml
  workflow_dispatch:
    inputs:
      python-version:
        description: "Override Python version for this run only (e.g. 3.11). Leave blank to use .python-version."
        required: false
        default: ""

permissions:
  contents: write   # needed to publish the zips as a GitHub Release

jobs:
  build:
    runs-on: windows-latest   # Windows Server VM with Visual Studio Build Tools (MSVC) preinstalled
    steps:
      - uses: actions/checkout@v7

      - name: Determine Python version
        id: pyver
        run: |
          $ver = "${{ inputs.python-version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = (Get-Content .python-version -Raw).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            throw "No Python version: set it in .python-version or type one when running by hand."
          }
          "PYVER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building for Python $ver"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          architecture: x64

      - name: Show toolchain
        run: |
          python --version
          python -c "import struct; print(struct.calcsize('P') * 8, 'bit')"

      - name: Build wheels for everything in requirements.txt
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel -r requirements.txt -w wheelhouse

      - name: Create venv from those wheels
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install --no-index --find-links wheelhouse -r requirements.txt
          .\venv\Scripts\python.exe -m pip freeze > venv\requirements.lock.txt
          Get-Content venv\requirements.lock.txt
          Copy-Item fix-venv.ps1 venv\

      - name: Zip
        run: |
          7z a -tzip "venv-py$($env:PYVER)-win_amd64.zip" venv | Out-Null
          if (Get-ChildItem wheelhouse -Filter *.whl -ErrorAction SilentlyContinue) {
            7z a -tzip "wheelhouse-py$($env:PYVER)-win_amd64.zip" wheelhouse | Out-Null
          }
          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-${{ github.run_number }}-py$($env:PYVER)"
          $fence = '```'
          $lock = (Get-Content venv\requirements.lock.txt -Raw -ErrorAction SilentlyContinue) ?? '(no packages)'
          @"
          Built for **Python $($env:PYVER), Windows x64** from commit ${{ github.sha }}.

          Installed packages:
          $fence
          $lock
          $fence
          "@ | Set-Content notes.md
          $files = @(Get-ChildItem *.zip | ForEach-Object { $_.Name })
          gh release create $tag $files --target ${{ github.sha }} --title "Build ${{ github.run_number }} (Python $($env:PYVER))" --notes-file notes.md --latest
